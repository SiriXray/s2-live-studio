<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音色试听 · S2 Live Studio</title>
<link rel="canonical" href="https://s2.106.15.126.46.nip.io/voices/">
<style>
:root{
  --bg:#0b0914;--panel:rgba(255,255,255,.055);--panel-strong:rgba(18,15,35,.86);
  --line:rgba(255,255,255,.10);--fg:#f5f1ff;--muted:#a49abf;--accent:#9b87ff;--accent2:#5b8cff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:
  radial-gradient(900px 540px at 8% -10%,rgba(124,88,255,.34),transparent 60%),
  radial-gradient(760px 460px at 96% 8%,rgba(214,92,255,.16),transparent 60%),
  radial-gradient(900px 700px at 52% 118%,rgba(54,90,255,.18),transparent 62%),
  var(--bg);color:var(--fg);font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
.wrap{width:min(1320px,calc(100% - 48px));margin:0 auto;padding:26px 0 60px}
.top{display:flex;align-items:center;gap:14px;padding:4px 0 18px}
.brand{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#a78bfa,#6d8cff);box-shadow:0 10px 30px rgba(124,108,255,.35)}
h1{font-size:22px;margin:0;letter-spacing:.02em}
.back{margin-left:auto;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
.back:hover{color:#fff;border-color:rgba(155,135,255,.6)}
.lead{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 18px}
.model-tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow:auto;padding:12px 0;margin:0 0 8px;background:linear-gradient(180deg,rgba(11,9,20,.96),rgba(11,9,20,.72),transparent);backdrop-filter:blur(16px);scrollbar-width:none}
.model-tabs::-webkit-scrollbar{display:none}
.model-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted);font-size:12px;cursor:pointer}
.model-tab i{width:7px;height:7px;border-radius:50%;background:var(--dot,#9b87ff);box-shadow:0 0 12px var(--dot,#9b87ff)}
.model-tab b{font-weight:500;color:var(--muted);font-size:10px}
.model-tab.active{color:#fff;border-color:rgba(155,135,255,.7);background:rgba(124,108,255,.18)}
.model-tab.active b{color:#cfc5ff}
.model-section{padding:26px 0 8px;scroll-margin-top:78px}
.section-head{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px}
.section-head h2{font-size:18px;margin:0;display:flex;align-items:center;gap:9px}
.section-head h2 i{width:8px;height:8px;border-radius:50%;background:var(--dot,#9b87ff);box-shadow:0 0 14px var(--dot,#9b87ff)}
.section-head p{margin:0 0 2px;color:var(--muted);font-size:11px}
.section-head .count{margin-left:auto;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.voice-card{position:relative;padding:16px;border:1px solid var(--line);border-radius:15px;background-color:rgba(18,15,35,.78);display:flex;flex-direction:column;gap:8px;min-height:170px;overflow:hidden;isolation:isolate}
.voice-card::before{content:'';position:absolute;top:0;right:0;bottom:0;width:46%;background:var(--portrait,none) center center/cover no-repeat;opacity:.66;filter:saturate(.92);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%,#000 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%,#000 100%);z-index:0;pointer-events:none}
.voice-card::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,10,22,.97) 0%,rgba(12,10,22,.82) 44%,rgba(12,10,22,.22) 74%,rgba(12,10,22,.10) 100%);z-index:1;pointer-events:none}
.voice-card > *{position:relative;z-index:2}
.voice-card:hover{border-color:rgba(155,135,255,.45)}
.voice-card:hover::before{opacity:.7}
.voice-top{display:flex;align-items:flex-start;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;color:#dfe6ff;background:linear-gradient(135deg,rgba(124,108,255,.32),rgba(91,140,255,.16));flex:0 0 34px}
.voice-name{font-size:15px;font-weight:600;line-height:1.2}
.voice-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:9px;line-height:1;padding:4px 6px;border-radius:5px;background:rgba(124,108,255,.10);border:1px solid rgba(124,108,255,.14);color:#c7d2ff;white-space:nowrap}
.tag.clone{background:rgba(255,138,92,.10);border-color:rgba(255,138,92,.2);color:#ffc2a8}
.tag.off{background:rgba(255,184,107,.08);border-color:rgba(255,184,107,.2);color:#ffcf8a}
.voice-card audio{width:100%;height:34px;margin-top:auto;border-radius:8px}
.voice-empty{font-size:11px;color:#ffcf8a;margin-top:auto;padding:8px 0}
.loading{color:var(--muted);padding:40px 0;text-align:center;font-size:13px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);color:var(--muted);font-size:11px;display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{width:min(100% - 28px,900px)}}
@media(max-width:620px){.grid{grid-template-columns:1fr}h1{font-size:19px}.lead{font-size:12px}.model-tab{padding:8px 11px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">S2</a>
    <h1>音色试听</h1>
    <a class="back" href="/">← 返回工作台</a>
  </div>
  <nav class="model-tabs" id="modelTabs" aria-label="模型切换"></nav>
  <main id="models"><div class="loading">正在加载音色…</div></main>
  <footer><span>S2 Live Studio</span><span>按模型展示 · 克隆音色归入 MiniMax</span></footer>
</div>
<script>
const STATIC_SOUL = [
  { id:'female_lively_d', name:'活泼小榆', voice:'LOXI_F_Y_ZH_Lively-Natural_Dialog_3abe', gender:'female', tags:['实测','对话'], audio:'/voices/soul/soul_lively.wav' },
  { id:'female_tender_e', name:'温柔书瑶', voice:'LOXI_F_Y_ZH_Tender-Natural_Dialog_d6c6', gender:'female', tags:['实测','温柔'], audio:'/voices/soul/soul_tender.wav' },
  { id:'male_velvety_f', name:'磁性砚川', voice:'LOXI_M_A_ZH_Velvety-Mature_Dialog_a7c0', gender:'male', tags:['实测','磁性'], audio:'/voices/soul/soul_velvety.wav' },
  { id:'female_clone', name:'女声克隆', voice:'s2_liuyifei_v030_11', gender:'female', tags:['实测','克隆'], audio:'/voices/soul/soul_clone_female.wav' },
  { id:'female_scholar_g', name:'知性书禾', voice:'LOXI_F_Y_ZH_Tender-Natural_Podcast_9dfb', gender:'female', tags:['实测','播客'], audio:'/voices/soul/soul_shuhe_podcast.mp3?v=3' },
  { id:'female_bright_h', name:'知性小夏', voice:'LOXI_F_Y_ZH_Lively-Natural_Podcast_1459', gender:'female', tags:['实测','播客'], audio:'/voices/soul/soul_xiaoxia_podcast.mp3?v=3' },
  { id:'female_cheery_i', name:'开朗映岚', voice:'LOXI_F_Y_ZH_Lively-Natural_Dialog_7ea6', gender:'female', tags:['实测','热情'], audio:'/voices/soul/soul_yinglan_dialog.wav' },
];
const STATIC_MINIMAX_LEGACY = [
  { name:'候选 A', voice:'voice_zh_3535668268758896', gender:'male', tags:['克隆候选','男声'], audio:'/voices/minimax/voice_zh_3535668268758896.mp3' },
  { name:'候选 B', voice:'clone_1793668736_4d87a4f2', gender:'male', tags:['克隆候选','男声'], audio:'/voices/minimax/clone_1793668736_4d87a4f2.mp3' },
  { name:'候选 C', voice:'probe_tts_01', gender:'female', tags:['克隆候选','女声'], audio:'/voices/minimax/probe_tts_01.mp3' },
  { name:'候选 D', voice:'voice_zh_3536631501522332', gender:'male', tags:['克隆候选','低音'], audio:'/voices/minimax/voice_zh_3536631501522332.mp3' },
];
const SOUL_EXTRA = [
  { name:'温柔书瑶 · 官方预置', voice:'LOXI_F_Y_ZH_Tender-Natural_Dialog_d6c6', gender:'female', tags:['官方预置'] },
  { name:'磁性砚川 · 官方预置', voice:'LOXI_M_A_ZH_Velvety-Mature_Dialog_a7c0', gender:'male', tags:['官方预置'] },
  { name:'知性书禾 · 官方预置', voice:'LOXI_F_Y_ZH_Tender-Natural_Podcast_9dfb', gender:'female', tags:['官方预置'] },
  { name:'知性小夏 · 官方预置', voice:'LOXI_F_Y_ZH_Lively-Natural_Podcast_1459', gender:'female', tags:['官方预置'] },
  { name:'开朗映岚 · 官方预置', voice:'LOXI_F_Y_ZH_Lively-Natural_Dialog_7ea6', gender:'female', tags:['官方预置'] },
];
const PORTRAITS = {
  '女明星3': '/voices/portraits/p43.jpg',
  '女明星1': '/voices/portraits/p3.jpg',
  '女明星2': '/voices/portraits/p60.jpg',
  '女主持': '/voices/portraits/p14.jpg',
  'Jay Shetty': '/voices/portraits/public-jay.jpg',
  '李佳琦': '/voices/portraits/public-lijiaqi.jpg',
  '罗永浩': '/voices/portraits/public-luo.jpg',
  '魏小河': '/voices/portraits/public-weixiaohe.jpg',
  '谢涛': '/voices/portraits/p34.jpg',
  'female-shaonv': '/voices/portraits/p5.jpg',
  'female-yujie': '/voices/portraits/p9.jpg',
  'female-chengshu': '/voices/portraits/p25.jpg',
  'female-tianmei': '/voices/portraits/p47.jpg',
  'male-qn-qingse': '/voices/portraits/p35.jpg',
  'male-qn-jingying': '/voices/portraits/p34.jpg',
  'male-qn-badao': '/voices/portraits/p38.jpg',
  'presenter_male': '/voices/portraits/p36.jpg',
  'presenter_female': '/voices/portraits/p23.jpg',
  'audiobook_male_1': '/voices/portraits/p36.jpg',
  'voice_zh_3535668268758896': '/voices/portraits/p13.jpg',
  'clone_1793668736_4d87a4f2': '/voices/portraits/p24.jpg',
  'probe_tts_01': '/voices/portraits/p11.jpg',
  'voice_zh_3536631501522332': '/voices/portraits/p37.jpg',
  'LOXI_F_Y_ZH_Lively-Natural_Dialog_3abe': '/voices/portraits/p49.jpg',
  'LOXI_F_Y_ZH_Tender-Natural_Dialog_d6c6': '/voices/portraits/p1.jpg',
  'LOXI_M_A_ZH_Velvety-Mature_Dialog_a7c0': '/voices/portraits/p44.jpg',
  's2_liuyifei_v030_11': '/voices/portraits/p7.jpg',
  'LOXI_F_Y_ZH_Tender-Natural_Podcast_9dfb': '/voices/portraits/p56.jpg',
  'LOXI_F_Y_ZH_Lively-Natural_Podcast_1459': '/voices/portraits/p39.jpg',
  'LOXI_F_Y_ZH_Lively-Natural_Dialog_7ea6': '/voices/portraits/p19.jpg',
  'zh_female_vv_uranus_bigtts': '/voices/portraits/p10.jpg',
  'zh_female_xiaohe_uranus_bigtts': '/voices/portraits/p51.jpg',
  'zh_male_m191_uranus_bigtts': '/voices/portraits/p45.jpg',
  'zh_male_taocheng_uranus_bigtts': '/voices/portraits/p35.jpg',
  'zh_female_qingxinnvsheng_uranus_bigtts': '/voices/portraits/p6.jpg',
  'zh_female_tianmeixiaoyuan_uranus_bigtts': '/voices/portraits/p57.jpg',
  'zh_female_shuangkuaisisi_uranus_bigtts': '/voices/portraits/p29.jpg',
  'zh_female_gaolengyujie_uranus_bigtts': '/voices/portraits/p9.jpg',
  'zh_male_yangguangqingnian_uranus_bigtts': '/voices/portraits/p13.jpg',
  'zh_male_cixingjieshuonan_uranus_bigtts': '/voices/portraits/p36.jpg',
  'xiaoyan': '/voices/portraits/p2.jpg',
  'aisjiuxu': '/voices/portraits/p36.jpg',
  'aisxping': '/voices/portraits/p54.jpg',
  'aisjinger': '/voices/portraits/p30.jpg',
  'aisbabyxu': '/voices/portraits/p26.jpg',
};
const state = { models: [], byId: {} };
const modelTabs = document.getElementById('modelTabs');
const root = document.getElementById('models');

function tagClass(text) {
  if (text.includes('克隆')) return 'tag clone';
  if (text.includes('未配置')) return 'tag off';
  return 'tag';
}
function cardFor(model, voice) {
  const article = document.createElement('article');
  article.className = 'voice-card';
  const portrait = PORTRAITS[voice.voice] || PORTRAITS[voice.name];
  if (portrait) article.style.setProperty('--portrait', `url("${portrait}")`);
  const top = document.createElement('div');
  top.className = 'voice-top';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = voice.gender === 'male' ? '男' : voice.gender === 'female' ? '女' : '声';
  const text = document.createElement('div');
  const name = document.createElement('div');
  name.className = 'voice-name';
  name.textContent = voice.name;
  const id = document.createElement('div');
  id.className = 'voice-id';
  id.textContent = voice.voice;
  text.append(name, id);
  top.append(avatar, text);
  const tags = document.createElement('div');
  tags.className = 'tags';
  for (const text of (voice.tags || []).slice(0, 3)) {
    const tag = document.createElement('span');
    tag.className = tagClass(text);
    tag.textContent = text;
    tags.appendChild(tag);
  }
  article.append(top, tags);
  if (voice.audio) {
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = voice.audio;
    audio.addEventListener('error', () => {
      const fail = document.createElement('div');
      fail.className = 'voice-empty';
      fail.textContent = '音频加载失败，请刷新';
      audio.replaceWith(fail);
    });
    article.appendChild(audio);
  } else {
    const empty = document.createElement('div');
    empty.className = 'voice-empty';
    empty.textContent = model.ready ? '试听暂不可用' : '未配置 Key，暂不可试听';
    article.appendChild(empty);
  }
  return article;
}
function render() {
  modelTabs.replaceChildren();
  root.replaceChildren();
  state.models.forEach((model, index) => {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'model-tab';
    tab.dataset.target = `model-${model.id}`;
    tab.style.setProperty('--dot', model.color);
    tab.innerHTML = `<i></i><span>${model.name}</span><b>${model.voices.length}</b>`;
    tab.addEventListener('click', () => {
      document.getElementById(`model-${model.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setActive(model.id);
    });
    modelTabs.appendChild(tab);
    const section = document.createElement('section');
    section.className = 'model-section';
    section.id = `model-${model.id}`;
    section.style.setProperty('--dot', model.color);
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<h2><i></i>${model.name}</h2><span class="count">${model.voices.length} 个音色</span>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const voice of model.voices) grid.appendChild(cardFor(model, voice));
    section.append(head, grid);
    root.appendChild(section);
    if (index === 0) setActive(model.id);
  });
}
function setActive(id) {
  for (const tab of modelTabs.querySelectorAll('.model-tab')) {
    tab.classList.toggle('active', tab.dataset.target === `model-${id}`);
  }
}
async function load() {
  const [catalogRes, clonesRes] = await Promise.all([
    fetch('/api/voice/catalog').then(r => r.json()),
    fetch('/api/voice/cloned').then(r => r.json()).catch(() => ({ items: [] })),
  ]);
  const catalog = catalogRes.providers || [];
  const cloneItems = clonesRes.items || [];
  const provider = id => catalog.find(item => item.id === id) || { id, name: id, ready: false, voices: [], hint: '' };
  const minimax = provider('minimax');
  const minimaxAudio = Object.fromEntries(minimax.voices.map(v => [v.id, `/voices/minimax/system/${v.id}.wav`]));
  const minimaxVoices = [
    ...cloneItems.map(item => ({ name: item.name, voice: item.voice_id, gender: item.gender, tags: [...new Set(['克隆', ...(item.tags || [])])], audio: item.demo })),
    ...minimax.voices.map(v => ({ ...v, voice: v.id, audio: minimaxAudio[v.id], tags: ['官方预置', ...(v.tags || [])] })),
    ...STATIC_MINIMAX_LEGACY,
  ];
  const soul = provider('soul');
  const soulVoices = [
    ...STATIC_SOUL,
    ...SOUL_EXTRA.filter(extra => !STATIC_SOUL.some(item => item.voice === extra.voice)),
  ];
  const doubao = provider('doubao');
  const iflytek = provider('iflytek');
  state.models = [
    { id:'minimax', name:'MiniMax', color:'#ff8a5c', ready:minimax.ready, hint:'官方预置 + 已克隆 + 历史候选', voices:minimaxVoices },
    { id:'soul', name:'Soul', color:'#a78bfa', ready:soul.ready, hint:'直播实测音色', voices:soulVoices },
    { id:'doubao', name:'豆包', color:'#5b8cff', ready:doubao.ready, hint:'火山引擎 · BV 系', voices:doubao.voices.map(v => ({ ...v, voice: v.id, tags:[...(v.tags||[])] })) },
    { id:'iflytek', name:'科大讯飞', color:'#46c7b8', ready:iflytek.ready, hint:'WebSocket v2', voices:iflytek.voices.map(v => ({ ...v, voice: v.id, tags:[...(v.tags||[])] })) },
  ];
  state.byId = Object.fromEntries(state.models.map(model => [model.id, model]));
  render();
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (entry.isIntersecting) setActive(entry.target.id.replace('model-', ''));
    }
  }, { rootMargin: '-20% 0px -70% 0px' });
  for (const section of root.querySelectorAll('.model-section')) observer.observe(section);
}
load().catch(error => {
  root.innerHTML = `<div class="loading">音色加载失败：${error.message}</div>`;
});
</script>
</body>
</html>
